<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Bahnschrift, 'Segoe UI', 'Arial Narrow', Arial, sans-serif">
  <title>From rep to result: V-Lo set processing</title>
  <!-- Text sizes chosen so the smallest text stays about 8 pt when the
       figure is printed about 7 in wide (paper-page width). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C8CFF"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A9B1BC"/>
    </marker>
    <style>
      .box   { fill: #1F2329; stroke: #343A43; stroke-width: 2; }
      .num   { fill: #6C8CFF; font-size: 30px; font-weight: 600; }
      .head  { fill: #F2EFE8; font-size: 44px; font-weight: 700; letter-spacing: 1px; }
      .sub   { fill: #E3E0D8; font-size: 32px; font-weight: 600; }
      .det   { fill: #B9C0CA; font-size: 30px; }
      .flow  { stroke: #6C8CFF; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .back  { stroke: #A9B1BC; stroke-width: 3; stroke-dasharray: 11 8; fill: none; marker-end: url(#arrowGrey); }
      .icon  { stroke: #6C8CFF; stroke-width: 5; fill: none; }
      .iconf { fill: #6C8CFF; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#16181C"/>

  <!-- Title -->
  <text x="45" y="92" fill="#F2EFE8" font-size="68" font-weight="700" letter-spacing="2">FROM REP TO RESULT</text>
  <text x="45" y="145" fill="#B9C0CA" font-size="34">What happens after the athlete presses Stop &amp; save</text>

  <!-- 1 Sensors -->
  <g transform="translate(45,190)">
    <rect class="box" width="270" height="350" rx="14"/>
    <text class="num" x="24" y="46">1</text>
    <circle class="icon" cx="82" cy="100" r="17"/><circle class="iconf" cx="82" cy="100" r="6"/>
    <circle class="icon" cx="188" cy="100" r="17"/><circle class="iconf" cx="188" cy="100" r="6"/>
    <line x1="99" y1="100" x2="171" y2="100" stroke="#8A93A0" stroke-width="8" stroke-linecap="round"/>
    <text class="head" x="135" y="196" text-anchor="middle">SENSORS</text>
    <text class="sub" x="135" y="244" text-anchor="middle">2× Movesense</text>
    <text class="det" x="135" y="290" text-anchor="middle">on the bar</text>
    <text class="det" x="135" y="330" text-anchor="middle">104 Hz</text>
  </g>

  <!-- 2 Web app -->
  <g transform="translate(355,190)">
    <rect class="box" width="270" height="350" rx="14"/>
    <text class="num" x="24" y="46">2</text>
    <rect class="icon" x="91" y="68" width="88" height="64" rx="7"/>
    <line class="icon" x1="91" y1="86" x2="179" y2="86"/>
    <rect class="iconf" x="123" y="97" width="24" height="24" rx="3"/>
    <text class="head" x="135" y="196" text-anchor="middle">WEB APP</text>
    <text class="sub" x="135" y="244" text-anchor="middle">via Bluetooth</text>
    <text class="det" x="135" y="290" text-anchor="middle">records the set,</text>
    <text class="det" x="135" y="330" text-anchor="middle">uploads raw data</text>
  </g>

  <!-- 3 Supabase -->
  <g transform="translate(665,190)">
    <rect class="box" width="270" height="350" rx="14"/>
    <text class="num" x="24" y="46">3</text>
    <ellipse class="icon" cx="135" cy="74" rx="40" ry="12"/>
    <path class="icon" d="M95,74 v46 a40,12 0 0 0 80,0 v-46"/>
    <path class="icon" d="M95,97 a40,12 0 0 0 80,0"/>
    <text class="head" x="135" y="196" text-anchor="middle">SUPABASE</text>
    <text class="sub" x="135" y="244" text-anchor="middle">PostgreSQL</text>
    <text class="det" x="135" y="290" text-anchor="middle">stores raw JSON</text>
    <text class="det" x="135" y="330" text-anchor="middle">and results</text>
  </g>

  <!-- 4 Azure -->
  <g transform="translate(975,190)">
    <rect class="box" width="270" height="350" rx="14"/>
    <text class="num" x="24" y="46">4</text>
    <rect class="iconf" x="80"  y="84" width="19" height="34" rx="3" opacity="0.45"/>
    <rect class="iconf" x="105" y="84" width="19" height="34" rx="3" opacity="0.65"/>
    <rect class="iconf" x="130" y="84" width="19" height="34" rx="3" opacity="0.85"/>
    <rect class="iconf" x="155" y="84" width="19" height="34" rx="3"/>
    <rect class="iconf" x="180" y="84" width="19" height="34" rx="3"/>
    <text class="head" x="135" y="196" text-anchor="middle">AZURE</text>
    <text class="sub" x="135" y="244" text-anchor="middle">processing</text>
    <text class="det" x="135" y="290" text-anchor="middle">computes</text>
    <text class="det" x="135" y="330" text-anchor="middle">velocity metrics</text>
  </g>

  <!-- 5 Feedback -->
  <g transform="translate(1285,190)">
    <rect class="box" width="270" height="350" rx="14"/>
    <text class="num" x="24" y="46">5</text>
    <rect x="92"  y="66" width="19" height="54" rx="3" fill="#6CC070"/>
    <rect x="117" y="75" width="19" height="45" rx="3" fill="#6CC070"/>
    <rect x="142" y="85" width="19" height="35" rx="3" fill="#E8C158"/>
    <rect x="167" y="95" width="19" height="25" rx="3" fill="#E8805A"/>
    <text class="head" x="135" y="196" text-anchor="middle">FEEDBACK</text>
    <text class="sub" x="135" y="244" text-anchor="middle">in the app</text>
    <text class="det" x="135" y="290" text-anchor="middle">speed vs. zone,</text>
    <text class="det" x="135" y="330" text-anchor="middle">next weight</text>
  </g>

  <!-- Flow arrows -->
  <path class="flow" d="M318,365 H351"/>
  <path class="flow" d="M628,365 H661"/>
  <path class="flow" d="M938,365 H971"/>
  <path class="flow" d="M1248,365 H1281"/>

  <!-- Results saved back: Azure -> Supabase -->
  <path class="back" d="M1110,543 V605 H800 V546"/>
  <text x="955" y="660" fill="#B9C0CA" font-size="32" text-anchor="middle">results saved back</text>
</svg>
